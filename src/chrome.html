<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: "Noto Sans Light";
    src: local("Noto Sans Light");
    font-weight: 300;
  }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent;
  }
  body {
    font-family: "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .brand {
    position: absolute;
    top: 7vh;
    left: 0; right: 0;
    text-align: center;
  }
  .brand-word {
    font-size: clamp(24px, 2.6vw, 46px);
    font-weight: 300;
    letter-spacing: 0.46em;
    /* optical nudge for the trailing letter-spacing on centered text */
    padding-left: 0.46em;
    color: #f2f5f3;
  }
  .brand-line {
    width: 9vw;
    max-width: 160px;
    height: 1px;
    margin: 1.4vh auto 0;
    background: linear-gradient(90deg, transparent, #38ff72, transparent);
    box-shadow:
      0 0 12px rgba(56, 255, 114, 0.55),
      0 0 30px rgba(56, 255, 114, 0.22);
  }

  .footer {
    position: absolute;
    bottom: 6.5vh;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3.2vw;
  }
  .control {
    display: flex;
    align-items: center;
    gap: 0.9vw;
    font-size: clamp(11px, 0.95vw, 16px);
    font-weight: 400;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #d8dedb;
  }
  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 3.2vw;
    height: 2.4vw;
    max-height: 38px;
    min-height: 26px;
    padding: 0 0.8vw;
    border: 1px solid rgba(56, 255, 114, 0.65);
    border-radius: 6px;
    color: #38ff72;
    background: rgba(10, 22, 14, 0.52);
    box-shadow:
      inset 0 0 14px rgba(56, 255, 114, 0.04),
      0 0 14px rgba(56, 255, 114, 0.04);
    font-size: clamp(11px, 0.9vw, 15px);
    font-weight: 500;
  }
  .key.arrow-key {
    min-width: 5.5vw;
    padding: 0;
    overflow: hidden;
  }
  .arrow {
    width: 50%;
    display: grid;
    place-items: center;
    color: #e7ece9;
    font-size: clamp(14px, 1.3vw, 22px);
    border-right: 1px solid rgba(56, 255, 114, 0.35);
    align-self: stretch;
  }
  .arrow:last-child { border-right: 0; }

  .sep {
    width: 1px;
    height: 2.2vw;
    max-height: 32px;
    background: rgba(255, 255, 255, 0.13);
  }
</style>
</head>
<body>

  <div class="brand">
    <div class="brand-word">VITREUM</div>
    <div class="brand-line"></div>
  </div>

  <div class="footer">
    <div class="control">
      <span class="key">Enter</span>
      <span>Boot</span>
    </div>
    <span class="sep"></span>
    <div class="control">
      <span class="key arrow-key">
        <span class="arrow">&#8592;</span>
        <span class="arrow">&#8594;</span>
      </span>
      <span>Navigate</span>
    </div>
    <span class="sep"></span>
    <div class="control">
      <span class="key">F2</span>
      <span>Settings</span>
    </div>
  </div>

</body>
</html>
