<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .canvas {
    width: 720px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .os {
    position: relative;
    width: 640px;
    height: 60px;
    border-radius: 16px;
    overflow: hidden;

    background:
      radial-gradient(60% 140% at 10% 15%, rgba(255,255,255,0.28), transparent 55%),
      radial-gradient(50% 120% at 92% 100%, rgba(120,255,180,0.16), transparent 60%),
      linear-gradient(155deg, rgba(255,255,255,0.10), rgba(20,45,32,0.62) 65%);

    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.55),
      inset 0 0 0 1px rgba(255,255,255,0.10),
      inset 0 -12px 20px -14px rgba(0,0,0,0.55),
      0 0 0 1px rgba(56,255,114,0.10),
      0 8px 28px rgba(0,0,0,0.5),
      0 0 36px rgba(56,255,114,0.20);

    border: 1.5px solid rgba(210,255,225,0.55);
  }

  .os::before {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,0.20);
    pointer-events: none;
  }

  .top-bar {
    position: absolute;
    top: -2px;
    left: 22%;
    right: 22%;
    height: 2.5px;
    background: #46ff85;
    box-shadow:
      0 0 10px #46ff85,
      0 0 28px rgba(70,255,130,0.75),
      0 0 60px rgba(70,255,130,0.35);
    border-radius: 99px;
    z-index: 2;
  }

  .sheen {
    position: absolute;
    top: -60%;
    left: -10%;
    width: 55%;
    height: 220%;
    background: linear-gradient(
      120deg,
      rgba(255,255,255,0.34),
      rgba(255,255,255,0.05) 40%,
      transparent 70%
    );
    transform: rotate(-8deg);
    filter: blur(2px);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="os">
      <div class="sheen"></div>
      <div class="top-bar"></div>
    </div>
  </div>
</body>
</html>
