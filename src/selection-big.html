<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .canvas {
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .glass-square {
    position: relative;
    width: 160px;
    height: 160px;
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(77, 255, 160, 0.55);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.4),
      0 0 48px rgba(77, 255, 160, 0.22),
      inset 0 1px 0 rgba(255,255,255,0.18),
      inset 0 0 26px rgba(77,255,160,0.07);
  }
  .glass-square::after {
    content: "";
    position: absolute;
    top: 7px;
    left: 7px;
    right: 30%;
    height: 40%;
    border-radius: 9px;
    background: linear-gradient(135deg, rgba(255,255,255,0.10), transparent 70%);
  }
</style>
</head>
<body>
  <div class="canvas"><div class="glass-square"></div></div>
</body>
</html>
