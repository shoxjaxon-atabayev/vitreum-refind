<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .canvas {
    width: 280px;
    height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .os {
    position: relative;
    width: 210px;
    height: 210px;
    border-radius: 18px;
    border: 1px solid rgba(190, 255, 210, 0.38);
    background: linear-gradient(
      145deg,
      rgba(255, 255, 255, 0.075),
      rgba(20, 40, 28, 0.48)
    );
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.11),
      0 0 0 1px rgba(56, 255, 114, 0.06),
      0 0 32px rgba(56, 255, 114, 0.13);
  }
  .os::before {
    /* the signature glowing top bar that marks the selected entry */
    content: "";
    position: absolute;
    top: -2px;
    left: 18%;
    right: 18%;
    height: 2px;
    background: #38ff72;
    box-shadow:
      0 0 8px #38ff72,
      0 0 24px rgba(56, 255, 114, 0.65);
    border-radius: 99px;
  }
  .os::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent 35%);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="canvas"><div class="os"></div></div>
</body>
</html>
