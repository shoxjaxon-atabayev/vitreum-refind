# Vitreum — HiDPI bucket (3840x2160). Pick this file if your firmware
# reports that resolution; banner_scale noscale keeps the asset 1:1, no
# runtime rescale cost. See PROJECT_SPEC.md §5 for the full bucket table.
#
# Icon set in icons/ ships at 128/48px only (no @2x variants), so this
# bucket intentionally keeps theme.conf's default icon_size/selection
# instead of the @2x assets — rEFInd would otherwise upscale 128px icons
# to fill a 256px slot, which is blurrier than just leaving them native.
include theme/vitreum/theme.conf

banner theme/vitreum/background-hidpi.png
banner_scale noscale
