# Vitreum — base theme config, shared by every resolution bucket.
# Include one bucket file (theme-sd.conf / theme-hd.conf / theme-hidpi.conf /
# theme-ultrawide.conf) from refind.conf — it includes this file in turn.

# drop a hand-picked icon set here using rEFInd's own os_*/tool_*/vol_*
# naming convention, plus an os_unknown fallback (PROJECT_SPEC.md §4)
icons_dir icons

selection_big  selection-big.png
selection_small selection-small.png

big_icon_size   128
small_icon_size 48

# rEFInd falls back to its own built-in rendering for any asset that is
# missing or fails to load, so a broken/missing file here never blanks
# the menu — see PROJECT_SPEC.md §6.
