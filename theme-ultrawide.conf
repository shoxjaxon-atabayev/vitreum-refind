# Vitreum — Ultrawide bucket (3440x1440). Pick this file if your firmware
# reports that resolution; banner_scale noscale keeps the asset 1:1, no
# runtime rescale cost. See PROJECT_SPEC.md §5 for the full bucket table.
#
# Fully self-contained on purpose — no `include theme.conf` here. rEFInd
# resolves a path written in refind.conf itself (or in a file refind.conf
# directly includes, like this one) relative to refind.conf's directory,
# but a *second*-level include (this file including yet another file)
# resolves paths relative to that nested file's own directory instead —
# confirmed by the banner below working while a nested icons_dir/selection
# did not. Duplicating these few lines across the 4 bucket files avoids
# that nested-include ambiguity entirely; keep it that way.

icons_dir theme/vitreum/icons

selection_big   theme/vitreum/selection-big.png
selection_small theme/vitreum/selection-small.png

big_icon_size   128
small_icon_size 48

banner theme/vitreum/background-ultrawide.png
banner_scale noscale

# hide rEFInd's own hint/description text — the footer/brand
# are baked into the banner PNG instead (see src/chrome.html)
hideui label,hints

# only show the tools we actually ship themed icons for — otherwise
# rEFInd fills the rest of its (longer) default tool list with its own
# stock colorful icons, which clash with the monochrome set
showtools shell,memtest,about,reboot,shutdown,exit,firmware
